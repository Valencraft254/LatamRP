<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALENCRAFT254 | Staff Portfolio</title>
<style>
:root {
    --azul: #3b82ff;
    --negro: #050505;
    --gris: #0f0f0f;
    --borde: rgba(255,255,255,0.08);
    --verde-fundador: linear-gradient(90deg, #00ff00, #00cc00);
    --rgb-animation: linear-gradient(270deg, #ff00ff, #00ffff, #ff9900, #00ff00);
}

/* Base */
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #0b0b1a 0%, #050505 100%);
    color: white;
}

/* Título */
h1 {
    text-align: center;
    margin-top: 20px;
    background: -webkit-linear-gradient(#3b82ff, #00ff00, #ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Container de Staff */
.staff-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 40px;
}

/* Tarjeta de miembro */
.staff-card {
    background: #111;
    border: 2px solid var(--borde);
    border-radius: 12px;
    width: 220px;
    padding: 20px;
    text-align: center;
    transition: transform 0.3s, border 0.3s, box-shadow 0.3s;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.staff-card:hover {
    transform: translateY(-5px);
    border: 2px solid var(--azul);
    box-shadow: 0 0 20px #3b82ff, 0 0 30px #ff00ff, 0 0 40px #00ff00;
}

/* Foto tipo Discord */
.staff-photo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 10px;
    object-fit: cover;
    border: 3px solid;
    border-image-slice: 1;
    border-width: 3px;
    border-image-source: var(--rgb-animation);
    animation: rgbBorder 4s linear infinite;
}

@keyframes rgbBorder {
    0% { border-image-source: linear-gradient(0deg, #ff00ff, #00ffff, #ff9900, #00ff00); }
    25% { border-image-source: linear-gradient(90deg, #00ffff, #ff9900, #00ff00, #ff00ff); }
    50% { border-image-source: linear-gradient(180deg, #ff9900, #00ff00, #ff00ff, #00ffff); }
    75% { border-image-source: linear-gradient(270deg, #00ff00, #ff00ff, #00ffff, #ff9900); }
    100% { border-image-source: linear-gradient(360deg, #ff00ff, #00ffff, #ff9900, #00ff00); }
}

/* Nombre */
.staff-name {
    font-size: 1.1em;
    font-weight: bold;
    margin-bottom: 5px;
}

/* Rol */
.staff-role {
    font-size: 0.9em;
    color: #00ff00; /* verde Fundador */
    background: rgba(0,255,0,0.1);
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-block;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Staff Fundador</h1>

<div class="staff-container">
    <div class="staff-card">
        <img src="https://placekitten.com/100/100" alt="itsnova91" class="staff-photo">
        <div class="staff-name">itsnova91</div>
        <div class="staff-role">Fundador</div>
    </div>
    <div class="staff-card">
        <img src="https://placekitten.com/101/101" alt="luisito.v.17_01107" class="staff-photo">
        <div class="staff-name">luisito.v.17_01107</div>
        <div class="staff-role">Fundador</div>
    </div>
    <div class="staff-card">
        <img src="https://placekitten.com/102/102" alt="valencraf" class="staff-photo">
        <div class="staff-name">valencraf</div>
        <div class="staff-role">Fundador</div>
    </div>
    <div class="staff-card">
        <img src="https://placekitten.com/103/103" alt="david_roblox0363_90312" class="staff-photo">
        <div class="staff-name">david_roblox0363_90312</div>
        <div class="staff-role">Fundador</div>
    </div>
</div>

</body>
</html>
