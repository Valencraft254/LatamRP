<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Roleplay | Roblox</title>

<style>
:root{
    --negro:#050505;
    --gris:#0b0b1a;
    --borde:rgba(255,255,255,.08);
    --galaxy: linear-gradient(270deg,#7c3aed,#3b82f6,#22d3ee,#a855f7);
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:radial-gradient(circle at top,#0b0b1a 0%,#050505 70%);
    color:#fff;
}

/* HEADER */
header{
    text-align:center;
    padding:70px 20px;
}

header h1{
    font-size:3em;
    background:var(--galaxy);
    background-size:400% 400%;
    animation:galaxy 6s ease infinite;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

header p{
    max-width:750px;
    margin:15px auto 0;
    color:#c7d2fe;
}

/* TITULO SECCION */
h2{
    text-align:center;
    font-size:2.2em;
    margin:80px 0 40px;
    background:var(--galaxy);
    background-size:400% 400%;
    animation:galaxy 6s ease infinite;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* FUNDADORES */
.fundadores{
    max-width:1100px;
    margin:0 auto 80px;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:35px;
}

.card{
    background:linear-gradient(180deg,#0b0b1a,#050505);
    border:1px solid var(--borde);
    border-radius:18px;
    padding:28px;
    text-align:center;
    transition:.35s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 30px rgba(59,130,246,.35);
}

.avatar{
    width:130px;
    height:130px;
    margin:0 auto 18px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid transparent;
    background:
        linear-gradient(#050505,#050505) padding-box,
        var(--galaxy) border-box;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nombre{
    font-size:1.2em;
    font-weight:800;
    background:var(--galaxy);
    background-size:400% 400%;
    animation:galaxy 5s linear infinite;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ANIMACION */
@keyframes galaxy{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* FOOTER */
footer{
    text-align:center;
    padding:50px 20px;
    color:#9ca3af;
    font-size:.9em;
}
</style>
</head>

<body>

<header>
    <h1>LATAM Roleplay</h1>
    <p>Servidor de Roleplay en Roblox con comunidad activa y staff profesional.</p>
</header>

<h2>Nuestros Fundadores</h2>

<div class="fundadores">

    <div class="card">
        <div class="avatar">
            <img src="fundador1.png">
        </div>
        <div class="nombre">valencraf</div>
    </div>

    <div class="card">
        <div class="avatar">
            <img src="fundador2.png">
        </div>
        <div class="nombre">itsnova91</div>
    </div>

    <div class="card">
        <div class="avatar">
            <img src="fundador3.png">
        </div>
        <div class="nombre">luisito.v.17_01107</div>
    </div>

    <div class="card">
        <div class="avatar">
            <img src="fundador4.png">
        </div>
        <div class="nombre">david_roblox0363_90312</div>
    </div>

</div>

<footer>
    © 2026 LATAM Roleplay · Todos los derechos reservados
</footer>

</body>
</html>
